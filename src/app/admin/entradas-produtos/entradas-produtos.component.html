<div class="admin-container">
  <div class="admin-container">
    <div class="admin-header" style="display: flex; justify-content: space-between; align-items: center;">
      <h2>Entrada de Produtos</h2>
      <a routerLink="/admin/dashboard" class="btn-voltar">← Voltar</a>
    </div>
    <!-- ... resto do código ... -->
  
    <div class="form-card">
      <h3>Registrar Nova Entrada</h3>
      <div class="form-row">
        <div class="form-group">
          <label>Produto:</label>
          <select [(ngModel)]="novaEntrada.iditem">
            <option [ngValue]="null" disabled>Selecione um produto</option>
            <option *ngFor="let p of produtos" [ngValue]="p.idItem || p.IdItem">
              {{ p.nomeItem || p.NomeItem }}
            </option>
          </select>
        </div>
        <div class="form-group">
          <label>Data:</label>
          <input type="date" [(ngModel)]="novaEntrada.dataEntradaProduto">
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label>Quantidade:</label>
          <input type="number" [(ngModel)]="novaEntrada.quantidadeEntrada" min="1">
        </div>
        <div class="form-group">
          <label>Valor Unitário (R$):</label>
          <input type="number" [(ngModel)]="novaEntrada.valorUnitarioEntrada" step="0.01">
        </div>
      </div>
  
      <button class="btn btn-primary" (click)="registrarEntrada()">Registrar Entrada</button>
    </div>
  
    <h3>Histórico de Entradas</h3>
    <div *ngIf="carregando" style="text-align: center; padding: 20px;">
      Carregando...
    </div>
  
    <table class="tabela-admin" *ngIf="!carregando">
      <thead>
        <tr>
          <th>ID</th>
          <th>Produto</th>
          <th>Data</th>
          <th>Qtd.</th>
          <th>Valor Unit.</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let e of entradas">
          <td>{{ getIdEntrada(e) }}</td>
          <td>{{ getNomeProduto(e.iditem || e.Iditem) }}</td>
          <td>{{ getData(e) }}</td>
          <td>{{ getQtd(e) }}</td>
          <td>R$ {{ getValor(e) | number:'1.2-2' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
