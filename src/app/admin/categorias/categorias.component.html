<!-- Container principal da tela -->
<div class="admin-container">
  
  <!-- Cabeçalho da tela (Verde escuro) -->
  <div class="admin-header">
    <h2>Gerenciar Categorias</h2>
    <!-- Botão para voltar ao Dashboard -->
    <a routerLink="/admin/dashboard" class="btn-voltar">← Voltar</a>
  </div>

  <!-- Formulário de Cadastro de Nova Categoria -->
  <div class="form-card">
    <h3>Nova Categoria</h3>
    <div class="form-row">
      <div class="form-group">
        <label>Nome da Categoria:</label>
        <!-- Input ligado à propriedade 'Categoriacol' do objeto 'novaCategoria' -->
        <input type="text" [(ngModel)]="novaCategoria.Categoriacol" placeholder="Ex: Maquiagem">
      </div>
      <!-- Botão que chama a função 'cadastrarCategoria()' no TS -->
      <button class="btn btn-primary" (click)="cadastrarCategoria()">Cadastrar</button>
    </div>
  </div>

  <!-- Mensagem que aparece enquanto os dados são buscados no banco -->
  <div *ngIf="carregando" style="text-align: center; padding: 20px;">
    Carregando categorias...
  </div>

  <!-- Tabela que lista as categorias (só aparece quando o carregamento termina) -->
  <table class="tabela-admin" *ngIf="!carregando">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome da Categoria</th>
      </tr>
    </thead>
    <tbody>
      <!-- Laço de repetição: para cada 'cat' na lista 'categorias', cria uma linha -->
      <tr *ngFor="let cat of categorias">
        <td>{{ getId(cat) }}</td>
        <td>{{ getNome(cat) }}</td>
      </tr>
    </tbody>
  </table>
</div>
