<div class="admin-container">
  <div class="admin-header">
    <h2>Gerenciar Categorias</h2>
    <a routerLink="/admin/dashboard" class="btn-voltar">← Voltar</a>
  </div>

  <!-- Formulário de Cadastro -->
  <div class="form-card">
    <h3>Nova Categoria</h3>
    <div class="form-row">
      <div class="form-group">
        <label>Nome da Categoria:</label>
        <input type="text" [(ngModel)]="novaCategoria.Categoriacol" placeholder="Ex: Maquiagem">
      </div>
      <button class="btn btn-primary" (click)="cadastrarCategoria()">Cadastrar</button>
    </div>
  </div>

  <!-- Lista de Categorias -->
  <div *ngIf="carregando" style="text-align: center; padding: 20px;">
    Carregando categorias...
  </div>

  <table class="tabela-admin" *ngIf="!carregando">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome da Categoria</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let cat of categorias">
        <td>{{ getId(cat) }}</td>
        
        <!-- Se NÃO estiver editando, mostra o nome -->
        <td *ngIf="categoriaEditando !== cat">{{ getNome(cat) }}</td>
        
        <!-- Se ESTIVER editando, mostra o input -->
        <td *ngIf="categoriaEditando === cat">
          <input type="text" [(ngModel)]="nomeEditado" style="padding: 5px; width: 100%;">
        </td>

        <!-- Ações -->
        <td>
          <!-- Modo Visualização: botões de Editar e Ativar/Desativar -->
          <div *ngIf="categoriaEditando !== cat" style="display: flex; gap: 5px;">
            <button (click)="editarCategoria(cat)" class="btn btn-sm btn-outline">Editar</button>
            
            <!-- Se estiver DESATIVADA, mostra o botão "Ativar" (verde) -->
            <button *ngIf="isDesativada(cat)" (click)="ativarCategoria(cat)" class="btn btn-sm btn-success">Ativar</button>
            
            <!-- Se estiver ATIVA, mostra o botão "Desativar" (laranja) -->
            <button *ngIf="!isDesativada(cat)" (click)="desativarCategoria(cat)" class="btn btn-sm btn-warning">Desativar</button>
          </div>

          <!-- Modo Edição: botões de Salvar e Cancelar -->
          <div *ngIf="categoriaEditando === cat" style="display: flex; gap: 5px;">
            <button (click)="salvarEdicao(cat)" class="btn btn-sm btn-success">Salvar</button>
            <button (click)="cancelarEdicao()" class="btn btn-sm btn-outline">Cancelar</button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
