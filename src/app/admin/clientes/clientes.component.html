<div class="admin-container">
    <div class="admin-container">
        <div class="admin-header" style="display: flex; justify-content: space-between; align-items: center;">
          <h2>Clientes Cadastrados</h2>
          <a routerLink="/admin/dashboard" class="btn-voltar">← Voltar </a>
        </div>
        <!-- ... resto do código ... -->
  
    <div *ngIf="carregando" style="text-align: center; padding: 20px;">
      Carregando clientes...
    </div>
  
    <table class="tabela-admin" *ngIf="!carregando">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>CPF</th>
          <th>E-mail</th>
          <th>Telefone</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cliente of clientes">
          <td>{{ getId(cliente) }}</td>
          <td>{{ getNome(cliente) }}</td>
          <td>{{ getCpf(cliente) }}</td>
          <td>{{ getEmail(cliente) }}</td>
          <td>{{ getTelefone(cliente) }}</td>
        </tr>
      </tbody>
    </table>
  </div>
