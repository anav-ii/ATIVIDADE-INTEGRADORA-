<!-- Container principal da tela -->
<div class="page-container">
  <h1>Meu Carrinho</h1>

  <!-- Mensagem que aparece se o carrinho estiver vazio -->
  <div *ngIf="itens.length === 0" class="carrinho-vazio">
    <p>Seu carrinho está vazio.</p>
    <a routerLink="/catalogo" class="btn btn-primary">Voltar para a Loja</a>
  </div>

  <!-- Layout do carrinho (só aparece se tiver itens) -->
  <div *ngIf="itens.length > 0" class="carrinho-layout">
    
    <!-- Lista de Itens -->
    <div class="carrinho-itens">
      <!-- Laço de repetição: para cada 'item' na lista 'itens', cria um card -->
      <div class="item-card" *ngFor="let item of itens">
        <div class="item-info">
          <h4>{{ getNome(item.item) }}</h4>
          <p>Quantidade: {{ item.quantidade }}</p>
        </div>
        <div class="item-acoes">
          <p class="preco">R$ {{ getPreco(item.item) | number:'1.2-2' }}</p>
          <!-- Botão que chama a função 'removerItem()' com o ID do item -->
          <button class="btn btn-danger" (click)="removerItem(item.item.Iditem || item.item.iditem)">
            Remover
          </button>
        </div>
      </div>
      
      <!-- Botão que limpa todo o carrinho -->
      <button class="btn btn-outline" style="margin-top: 20px;" (click)="limparCarrinho()">
        Limpar Carrinho
      </button>
    </div>

    <!-- Resumo do Pedido -->
    <aside class="carrinho-resumo">
      <h3>Resumo do Pedido</h3>
      <div class="linha-resumo">
        <span>Total:</span>
        <!-- Mostra o valor total formatado com 2 casas decimais -->
        <strong>R$ {{ total | number:'1.2-2' }}</strong>
      </div>
      
      <!-- Botão que chama a função 'finalizarPedido()' -->
      <button (click)="finalizarPedido()" class="btn btn-primary btn-block" style="width: 100%;">Finalizar Pedido</button>
      <a routerLink="/catalogo" class="btn btn-outline btn-block" style="margin-top: 10px;">Continuar Comprando</a>
    </aside>

  </div>
</div>
